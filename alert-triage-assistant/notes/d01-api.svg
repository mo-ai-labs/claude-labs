<text x="0" y="26.0" font-size="26" fill="#1e1e1e" text-anchor="start" font-weight="600" xml:space="preserve">① The API is stateless — YOU carry the history</text>
<text x="0" y="90.0" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Call 1</text>
<text x="118.0" y="89.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">U1</text>
<text x="248.0" y="89.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">A1</text>
<text x="0" y="160.0" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Call 2</text>
<text x="118.0" y="159.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">U1</text>
<text x="182.0" y="159.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">A1</text>
<text x="246.0" y="159.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">U2</text>
<text x="376.0" y="159.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">A2</text>
<text x="0" y="230.0" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Call 3</text>
<text x="118.0" y="229.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">U1</text>
<text x="182.0" y="229.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">A1</text>
<text x="246.0" y="229.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">U2</text>
<text x="310.0" y="229.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">A2</text>
<text x="374.0" y="229.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">U3</text>
<text x="504.0" y="229.75" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">A3</text>
<text x="90" y="290.0" font-size="16" fill="#e03131" text-anchor="start" xml:space="preserve">messages = [...] resent every call  →  input_tokens grows every turn (= cost)</text>
<text x="320.0" y="335.0" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">No conversation_id. No server memory.</text>
<text x="320.0" y="355.0" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Assistant turns can even be synthetic (you wrote them).</text>
<text x="320.0" y="375.0" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">system: top-level field; a mid-chat system message is appended at the end</text>
<text x="720" y="26.0" font-size="26" fill="#1e1e1e" text-anchor="start" font-weight="600" xml:space="preserve">② It failed. Retry or fix?</text>
<text x="1030.0" y="87.5" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="600" xml:space="preserve">HTTP error</text>
<text x="1030.0" y="180.5" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Transient?</text>
<text x="1030.0" y="203.0" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(load / server)</text>
<text x="865.0" y="210.5" font-size="16" fill="#2f9e44" text-anchor="middle" xml:space="preserve">yes</text>
<text x="1195.0" y="210.5" font-size="16" fill="#e03131" text-anchor="middle" xml:space="preserve">no</text>
<text x="850.0" y="302.625" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">RETRY ↻</text>
<text x="850.0" y="323.875" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"></text>
<text x="850.0" y="345.125" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">429 rate_limit_error</text>
<text x="850.0" y="366.375" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">  (honor retry-after)</text>
<text x="850.0" y="387.625" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">500 api_error</text>
<text x="850.0" y="408.875" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">504 timeout_error</text>
<text x="850.0" y="430.125" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">529 overloaded_error</text>
<text x="1230.0" y="292.0" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">FIX THE REQUEST ✎</text>
<text x="1230.0" y="313.25" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"></text>
<text x="1230.0" y="334.5" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">400 invalid_request_error</text>
<text x="1230.0" y="355.75" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">401 authentication_error</text>
<text x="1230.0" y="377.0" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">402 billing_error</text>
<text x="1230.0" y="398.25" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">403 permission_error</text>
<text x="1230.0" y="419.5" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">404 not_found_error</text>
<text x="1230.0" y="440.75" font-size="17" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">413 request_too_large</text>
<text x="850.0" y="501.875" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">SDK auto-retries with</text>
<text x="850.0" y="520.625" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">exponential backoff</text>
<text x="850.0" y="539.375" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(how many times? → Bet B)</text>
<text x="1230.0" y="501.875" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Trap: spend-cap 429 has</text>
<text x="1230.0" y="520.625" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">NO retry-after → retrying</text>
<text x="1230.0" y="539.375" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">won&#x27;t help (treat as fix)</text>
<text x="720" y="585.0" font-size="15" fill="#1971c2" text-anchor="start" xml:space="preserve">Log every call: request-id · model · usage · stop_reason  (audit trail for triage decisions)</text>
</svg>