[project]
name = "alert-triage-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi[standard]>=0.142.2",
    "pydantic>=2.13.5",
]

[project.scripts]
alert-triage-assistant = "alert_triage_assistant:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
